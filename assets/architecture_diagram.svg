<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0d13; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D500F9"/>
      <stop offset="100%" stop-color="#651FFF"/>
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161c28" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e131d" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg-grad)"/>

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="680"/>
    <line x1="300" y1="0" x2="300" y2="680"/>
    <line x1="450" y1="0" x2="450" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="750" y1="0" x2="750" y2="680"/>
    <line x1="900" y1="0" x2="900" y2="680"/>
    <line x1="1050" y1="0" x2="1050" y2="680"/>
  </g>

  <!-- Header Section -->
  <text x="600" y="55" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="2">AGI ANTIGRAVITY CORE :: 5-SECTOR NEURAL ARCHITECTURE</text>
  <text x="600" y="82" text-anchor="middle" fill="#00E5FF" font-size="13" font-weight="500" letter-spacing="1.5">SYSTEM 2 AUTONOMOUS COGNITIVE ENGINE • 70 SKILLS • Q ≥ 9.0 QUALITY FIREWALL</text>

  <!-- Connection Lines (Data Stream Bus) -->
  <path d="M 210 240 L 600 170 L 990 240" stroke="#651FFF" stroke-width="2" stroke-dasharray="6,6" fill="none" opacity="0.6"/>
  <path d="M 210 490 L 600 370 L 990 490" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6,6" fill="none" opacity="0.6"/>
  <line x1="600" y1="220" x2="600" y2="320" stroke="#FFD600" stroke-width="2.5" opacity="0.8"/>

  <!-- Central Hub: Sovereign Intelligence Core -->
  <g transform="translate(440, 120)">
    <rect width="320" height="100" rx="14" fill="url(#card-grad)" stroke="url(#cyan-glow)" stroke-width="2" filter="url(#glow)"/>
    <rect width="320" height="100" rx="14" fill="url(#card-grad)" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="160" y="38" text-anchor="middle" fill="#00E5FF" font-size="16" font-weight="800" letter-spacing="1">⚡ CORE REASONING &amp; LAWS</text>
    <text x="160" y="62" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Constitutional Invariants &amp; Three-Tempo</text>
    <text x="160" y="82" text-anchor="middle" fill="#90A4AE" font-size="11">AGENTS.md • T₋₁ Calibration • Latent X → X∪Y</text>
  </g>

  <!-- Sector 1: Cognitive Planning & Epistemic Governance -->
  <g transform="translate(50, 190)">
    <rect width="320" height="130" rx="12" fill="url(#card-grad)" stroke="#651FFF" stroke-width="1.5"/>
    <text x="20" y="32" fill="#D500F9" font-size="14" font-weight="700">🧠 SECTOR 1: COGNITIVE PLANNING</text>
    <text x="20" y="58" fill="#ECEFF1" font-size="12" font-weight="600">• Epistemic Governance &amp; Deep Planning</text>
    <text x="20" y="78" fill="#ECEFF1" font-size="12" font-weight="600">• Active Inference Theory of Mind</text>
    <text x="20" y="98" fill="#ECEFF1" font-size="12" font-weight="600">• Cognitive State Memory &amp; DAG Maps</text>
    <text x="20" y="116" fill="#78909C" font-size="10">22 Autonomous Skills Loaded</text>
  </g>

  <!-- Sector 2: Superpowers TDD & Causal Debugging -->
  <g transform="translate(50, 430)">
    <rect width="320" height="130" rx="12" fill="url(#card-grad)" stroke="#00E676" stroke-width="1.5"/>
    <text x="20" y="32" fill="#00E676" font-size="14" font-weight="700">🛠️ SECTOR 2: TDD &amp; ENGINEERING</text>
    <text x="20" y="58" fill="#ECEFF1" font-size="12" font-weight="600">• True Red-Green-Refactor TDD</text>
    <text x="20" y="78" fill="#ECEFF1" font-size="12" font-weight="600">• 4-Phase Causal Root-Cause Debugging</text>
    <text x="20" y="98" fill="#ECEFF1" font-size="12" font-weight="600">• Master Refactoring &amp; Zero-Placeholders</text>
    <text x="20" y="116" fill="#78909C" font-size="10">8 Autonomous Skills Loaded</text>
  </g>

  <!-- Central Engine: Gauntlet-Loop Adversarial Convergence -->
  <g transform="translate(440, 320)">
    <rect width="320" height="140" rx="14" fill="url(#card-grad)" stroke="url(#gold-glow)" stroke-width="2"/>
    <text x="160" y="34" text-anchor="middle" fill="#FFD600" font-size="15" font-weight="800" letter-spacing="1">⚔️ GAUNTLET-LOOP ADVERSARIAL</text>
    <text x="160" y="60" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Double-Blind Builder vs. Critic Review</text>
    <text x="160" y="82" text-anchor="middle" fill="#CFD8DC" font-size="11">Gate 1: 100% Deterministic Test Pass</text>
    <text x="160" y="102" text-anchor="middle" fill="#CFD8DC" font-size="11">Gate 2: Interactive Visual Proof</text>
    <text x="160" y="122" text-anchor="middle" fill="#00E676" font-size="12" font-weight="700">Gate 3: Quality Score Q ≥ 9.0/10</text>
  </g>

  <!-- Sector 3: Adversarial Quality & Popperian Testing -->
  <g transform="translate(830, 190)">
    <rect width="320" height="130" rx="12" fill="url(#card-grad)" stroke="#FF1744" stroke-width="1.5"/>
    <text x="20" y="32" fill="#FF5252" font-size="14" font-weight="700">🛡️ SECTOR 3: ADVERSARIAL QUALITY</text>
    <text x="20" y="58" fill="#ECEFF1" font-size="12" font-weight="600">• Red Team vs Blue Team Tribunal</text>
    <text x="20" y="78" fill="#ECEFF1" font-size="12" font-weight="600">• Popperian Invariance Falsification</text>
    <text x="20" y="98" fill="#ECEFF1" font-size="12" font-weight="600">• Point W Evolutionary Convergence</text>
    <text x="20" y="116" fill="#78909C" font-size="10">12 Autonomous Skills Loaded</text>
  </g>

  <!-- Sector 4 & 5: DevTools & Swarm/Spatial Multimodal -->
  <g transform="translate(830, 430)">
    <rect width="320" height="130" rx="12" fill="url(#card-grad)" stroke="#00B0FF" stroke-width="1.5"/>
    <text x="20" y="32" fill="#00E5FF" font-size="14" font-weight="700">🌐 SECTOR 4 &amp; 5: DEVTOOLS &amp; SWARMS</text>
    <text x="20" y="58" fill="#ECEFF1" font-size="12" font-weight="600">• Chrome DevTools, A11y &amp; LCP Audits</text>
    <text x="20" y="78" fill="#ECEFF1" font-size="12" font-weight="600">• Corporate Swarm OS (C_max ≤ 2)</text>
    <text x="20" y="98" fill="#ECEFF1" font-size="12" font-weight="600">• Procedural 3D/GLSL &amp; Real Audio</text>
    <text x="20" y="116" fill="#78909C" font-size="10">28 Autonomous Skills Loaded</text>
  </g>

  <!-- Bottom Footer Invariant Bar -->
  <g transform="translate(50, 600)">
    <rect width="1100" height="50" rx="8" fill="#101520" stroke="#1E293B" stroke-width="1"/>
    <text x="550" y="30" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="500">
      🔒 ZERO-PLACEHOLDER INVARIANT • 100% EXECUTABLE CODE • REACTIVE ASYNC NOTIFICATIONS • DETERMINISTIC PYTHON CLI
    </text>
  </g>
</svg>